services:
  wishlist-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: filimonq/wishlist-service:latest

    env_file: .env

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    # security
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

    networks:
      - wishlist-network

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  postgres:
    image: docker.io/library/postgres:18-alpine

    env_file: .env

    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M

    networks:
      - wishlist-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  wishlist-network:
    driver: bridge

volumes:
  postgres-data:
