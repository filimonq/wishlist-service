apiVersion: v1
kind: ServiceAccount
metadata:
  name: wishlist-vector
  namespace: wishlist
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wishlist-vector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wishlist-vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wishlist-vector
subjects:
  - kind: ServiceAccount
    name: wishlist-vector
    namespace: wishlist
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wishlist-vector-config
  namespace: wishlist
data:
  vector.yaml: |
    data_dir: /var/lib/vector

    sources:
      application:
        type: kubernetes_logs
        self_node_name: ${VECTOR_SELF_NODE_NAME}
        extra_field_selector: metadata.namespace=wishlist
        extra_label_selector: app=wishlist-service

    transforms:
      application_json:
        type: remap
        inputs: [application]
        drop_on_error: false
        source: |
          metadata = .kubernetes
          original_message = .message
          event_time = .timestamp
          parsed, parse_error = parse_json(original_message)
          if parse_error == null && is_object(parsed) {
            . = merge({"timestamp": event_time, "service.name": "wishlist-service"}, object!(parsed))
          } else {
            . = {
              "message": original_message,
              "timestamp": event_time,
              "service.name": "wishlist-service",
              "level": "WARN",
              "log.parse_error": "expected a JSON object"
            }
            if parse_error != null {
              ."log.parse_error" = parse_error
            }
          }
          ."k8s.pod.name" = metadata.pod_name
          ."k8s.namespace.name" = metadata.pod_namespace
          ."k8s.node.name" = metadata.pod_node_name
          ."k8s.container.name" = metadata.container_name

    sinks:
      victoria_logs:
        type: elasticsearch
        inputs: [application_json]
        endpoints: [http://victoria-logs:9428/insert/elasticsearch/]
        api_version: v8
        mode: bulk
        compression: gzip
        bulk:
          index: wishlist
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: service.name,k8s.namespace.name,k8s.pod.name
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wishlist-vector
  namespace: wishlist
spec:
  selector:
    matchLabels:
      app: wishlist-vector
  template:
    metadata:
      labels:
        app: wishlist-vector
    spec:
      serviceAccountName: wishlist-vector
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: vector
          image: timberio/vector:0.54.0-alpine
          imagePullPolicy: IfNotPresent
          args: [--config, /etc/vector/vector.yaml, --log-format, json]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: wishlist-vector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: docker-logs
          hostPath:
            path: /var/lib/docker/containers
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/wishlist-vector
            type: DirectoryOrCreate
